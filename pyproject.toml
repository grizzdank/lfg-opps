[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lfg-opps"
version = "0.1.0"
description = "Automated consulting opportunity discovery for LFG Consultants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "freelancersdk>=0.1.20",
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "click>=8.1",
    "sqlite-utils>=3.35",
    "schedule>=1.2",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
lfg-opps = "src.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
